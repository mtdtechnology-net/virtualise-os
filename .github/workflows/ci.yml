name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VirtualiseOS
    runs-on: mac-mini
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build app
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/VirtualiseOSDerivedData
        run: |
          xcodebuild \
            -project VirtualiseOS.xcodeproj \
            -scheme VirtualiseOS-Swift \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            build
